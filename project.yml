name: Friday
options:
  bundleIdPrefix: com.dhruvchawla
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Friday:
    type: application
    platform: macOS
    sources: [Friday]
    entitlements:
      path: Friday/App/Friday.entitlements
      properties:
        # Sandboxed with NO network entitlement: macOS itself blocks Friday from the internet.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Read today's events (read-only use).
        com.apple.security.personal-information.calendars: true
        # AI usage: read-only access to exactly the files AI tools already write
        # about their own usage. Nothing else in the home folder. See docs/PRIVACY.md.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.claude/projects/
          - /.claude/sessions/
          - /.claude/friday/
          - /Library/Application Support/Wispr Flow/config.json
          # WhatsApp for Mac's own chat database: unread counts only, opened read-only.
          - /Library/Group Containers/group.net.whatsapp.WhatsApp.shared/ChatStorage.sqlite
          - /Library/Group Containers/group.net.whatsapp.WhatsApp.shared/ChatStorage.sqlite-wal
          - /Library/Group Containers/group.net.whatsapp.WhatsApp.shared/ChatStorage.sqlite-shm
        # Screenshot and snip: write PNGs to ~/Desktop only. Nothing else in the home folder.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Desktop/
        # Look up ONE local XPC service: the separate Friday Online app, which is the only
        # networked component and answers only usage-limit questions. Not a network entitlement.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.dhruvchawla.friday.online
        # Apple Events, all local: Chrome (WhatsApp Web's unread number when the Mac app is
        # missing; what YouTube tabs are playing) and Spotify (what is playing, play/pause/skip).
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.google.Chrome
          - com.spotify.client
    info:
      path: Friday/App/Info.plist
      properties:
        CFBundleDisplayName: Friday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: Friday asks Spotify and Chrome what is playing so it can show it and play, pause or skip when you ask. Without WhatsApp for Mac it reads WhatsApp Web's unread number from Chrome tab titles. It never reads messages or page text, and never saves what you play.
        NSCalendarsFullAccessUsageDescription: Friday shows how many events you have left today and what is next.
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Dhruv Chawla. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhruvchawla.friday
        PRODUCT_NAME: Friday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FridayTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FridayTests]
    dependencies:
      - target: Friday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dhruvchawla.friday.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Friday:
    build:
      targets:
        Friday: all
        FridayTests: [test]
    test:
      targets: [FridayTests]
      gatherCoverageData: true
