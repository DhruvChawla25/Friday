name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: a workflow run (including one from a fork) cannot push,
# change settings or comment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: No-network check
        run: Scripts/check-no-network.sh
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Package DMG
        run: make dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Friday-dmg
          path: build/Friday.dmg
          retention-days: 14
